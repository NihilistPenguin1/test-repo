pull_request_rules:
  - name: bbp test label
    conditions:
      - base = main
    actions:
      label:
        add: ["bbp-test"]
  - name: bbp queue
    conditions:
      - base = main
      - label = bbp-queue
    actions:
      queue:
merge_protections_settings:
  auto_merge_conditions: true
queue_rules:
  - name: bbp
    merge_conditions:
      - check-success = bbp-never-passes
