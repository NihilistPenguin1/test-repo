pull_request_rules:
  - name: bbp test label
    conditions:
      - base = main
    actions:
      label:
        add: ["bbp-test"]
  - name: bbp queue
    conditions:
      - base = main
      - label = bbp-queue
    actions:
      queue:
queue_rules:
  - name: bbp
    checks_timeout: 1 minute
    merge_conditions:
      - check-success = bbp-ghost-check
