pull_request_rules:
  - name: bbp test label
    conditions:
      - base = main
    actions:
      label:
        add: ["bbp-test"]
  - name: t20 queue
    conditions:
      - base = main
      - label = bbp-queue
    actions:
      queue:
        name: bbp20
queue_rules:
  - name: bbp20
    checks_timeout: 6 minutes
    merge_conditions:
      - check-success = bbp-q20
