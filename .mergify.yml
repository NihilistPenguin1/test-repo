pull_request_rules:
  - name: poc auto-label
    conditions:
      - base = main
    actions:
      label:
        add: ["poc-f1"]
  - name: poc queue
    conditions:
      - base = main
      - label = poc-queue
    actions:
      queue:
        name: pocf1
queue_rules:
  - name: pocf1
    checks_timeout: 10 minutes
    merge_conditions:
      - check-success = poc-gate
