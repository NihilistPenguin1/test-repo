pull_request_rules:
  - name: bbp test label
    conditions:
      - base = main
    actions:
      label:
        add: ["bbp-test"]
  - name: bbp queue
    conditions:
      - base = main
      - label = bbp-queue
    actions:
      queue:
  - name: bbp tpl cond
    conditions:
      - base = main
      - label = bbp-tpl-cond
      - 'title ~= ^BBP queue testi \(PR #{{ 1+1 }}\)$'
    actions:
      label:
        add: ["bbp-cond-fired"]
  - name: bbp tpl labelname
    conditions:
      - base = main
      - label = bbp-tpl-lbl
    actions:
      label:
        add: ["bbp-lbl-{{ 7*7 }}"]
  - name: bbp tpl dblrender
    conditions:
      - base = main
      - label = bbp-tpl-dbl
    actions:
      comment:
        message: |
          BBP-TEMPLATE-DBL
          D1={{ title }}
          D2={{ number }}
queue_rules:
  - name: bbp
    merge_conditions:
      - check-success = bbp-never-passes
