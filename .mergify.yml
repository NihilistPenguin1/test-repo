pull_request_rules:
  - name: bbp test label
    conditions:
      - base = main
    actions:
      label:
        add: ["bbp-test"]
  - name: sticky-probe
    conditions:
      - base = main
      - label = bbp-q22-probe
      - check-success = bbp-q22
      - check-failure = bbp-q22
    actions:
      label:
        add: ["probe-sticky"]
queue_rules:
  - name: bbp
    merge_conditions:
      - check-success = bbp-never-passes
