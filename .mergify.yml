pull_request_rules:
  - name: bbp test label
    conditions:
      - base = main
    actions:
      label:
        add: ["bbp-test"]
  - name: bbp18 queue
    conditions:
      - base = main
      - label = bbp-queue
    actions:
      queue:
        name: bbp18
queue_rules:
  - name: bbp18
    checks_timeout: auto
    merge_conditions:
      - check-success = bbp-ok18
