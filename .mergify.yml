pull_request_rules:
  - name: t33 queue trigger
    conditions:
      - base = main
      - label = t33-queue
    actions:
      queue:
        name: t33q
  - name: t33 direct merge
    conditions:
      - base = main
      - label = t33-merge
      - check-success = t33-direct
    actions:
      merge:
        method: squash
queue_rules:
  - name: t33q
    checks_timeout: 10 minutes
    merge_conditions:
      - check-success = t33-gate
